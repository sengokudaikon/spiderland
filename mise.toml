# Project tasks: `mise tasks` lists them, `mise run <task>` runs one.
# Rust nightly is selected by rust-toolchain.toml.

[tasks.lint]
description = "Clippy over every target, warnings as errors, over spiderland's nightly feature, and over its library without testing"
run = [
    "cargo clippy --workspace --all-targets --offline -- -D warnings",
    "cargo clippy -p spiderland --all-targets --features nightly --offline -- -D warnings",
    # Test targets turn `testing` on, through the dev-dependency. The library alone is built as an app's normal build is.
    "cargo clippy -p spiderland --lib --offline -- -D warnings",
]

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Fail if anything is unformatted"
run = "cargo fmt --all --check"

[tasks.test]
description = "Every test of the workspace, and spiderland's with its nightly feature"
run = ["cargo test --workspace --offline", "cargo test -p spiderland --features nightly --offline"]

[tasks.doc]
description = "Build the docs, warnings as errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --offline"

[tasks.deny]
description = "Check dependencies for advisories, licenses and sources. Needs the network"
tools = { "aqua:EmbarkStudios/cargo-deny" = "0.20.2" }
run = "cargo deny --locked check"

[tasks.verify]
description = "Everything to run before calling work done: lint, format, tests, docs"
run = ["mise run lint", "mise run fmt:check", "mise run test", "mise run doc"]
