# What `cargo deny check` accepts in the dependency tree.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Only our direct dependencies: an unmaintained crate deep in Slint's tree moves when Slint does.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Slint offers a choice of licenses. This one keeps the check passing with no copyleft allowed. An app using Slint picks its own.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
# Slint's tree brings several versions of the Windows crates, and that is not ours to fix.
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
