[package]
name = "spiderland"
description = "A one-way frame for a UI: intents go into a pure reducer, and effects and renders come out."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# `nightly`: `Feature::Subscription` defaults to `Never`, through associated type defaults, so a feature that wants no
# subscriptions leaves it out. It needs a nightly compiler. Without it the crate builds on stable, and every feature names the
# type.
nightly = []
# `testing`: what only tests want. `CheckedSlice` checks its key only under it, and `Store::with_state` exists only under it. Turn
# it on from dev-dependencies, so a normal build doesn't pay for the check and can't change a store's state behind its reducer.
testing = []

[dependencies]
# Channels only, for work that comes back to the UI thread. No runtime: the app brings its own pool.
tokio.workspace = true

[dev-dependencies]
# This crate's own tests use its `testing` feature.
spiderland = { path = ".", features = ["testing"] }

[lints]
workspace = true
