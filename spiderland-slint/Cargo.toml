[package]
name = "spiderland-slint"
description = "Runs spiderland features under Slint: background work, timers and row models."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# `testing`: the real window with no display, for tests that drive it by real input.
testing = []

[dependencies]
spiderland.workspace = true
spiderland-phrases.workspace = true
sys-locale.workspace = true
slint.workspace = true
tokio.workspace = true

[dev-dependencies]
# This crate's own tests use its `testing` feature.
spiderland-slint = { path = ".", features = ["testing"] }

[lints]
workspace = true
