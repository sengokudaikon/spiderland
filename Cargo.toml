# A small frame for desktop UIs. See README.md.
[workspace]
resolver = "3"
members = ["spiderland", "spiderland-slint", "spiderland-phrases", "spiderland-phrases-build"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Slint is pinned exactly: point releases have broken APIs before.
slint = "=1.18.1"
tokio = { version = "=1.53.3", features = ["sync"] }
# The parser slint-build bundles translations with, so the Rust phrases' table takes what the views take.
rspolib = "=0.1.2"
# The user's locale, read as Slint reads it to pick a bundled translation.
sys-locale = "0.3.2"
tempfile = "3.27.0"
windows-sys = "0.61.2"

spiderland = { path = "spiderland" }
spiderland-phrases = { path = "spiderland-phrases" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.dev]
debug = "line-tables-only"
