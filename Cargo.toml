# A small frame for desktop UIs. See README.md.
[workspace]
resolver = "3"
members = ["spiderland", "spiderland-slint"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Slint is pinned exactly: point releases have broken APIs before.
slint = "=1.18.1"
tokio = { version = "=1.53.3", features = ["sync"] }

spiderland = { path = "spiderland" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.dev]
debug = "line-tables-only"
